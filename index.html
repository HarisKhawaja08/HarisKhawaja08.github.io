<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Haris</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
    }

    .card {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #d1d5db;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      text-decoration: none;
      color: white;
      border: 1px solid #374151;
      border-radius: 8px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #1f2937;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hello 👋</h1>

    <p>
      Welcome to my personal website.
      I'm learning software development and building cool projects.
    </p>

    <a href="https://github.com/HarisKhawaja08" class="btn">
      Visit My GitHub
    </a>

    <div class="footer">
      © 2026 Your Name
    </div>
  </div>
</body>
</html>
